nodeLinker: node-modules

# Fetch and publish against npm itself. Yarn's default registry is
# registry.yarnpkg.com, a read-only mirror whose PUT answers 404, and keeping
# both registries identical means the auth token unambiguously applies to both.
npmRegistryServer: 'https://registry.npmjs.org'
npmPublishRegistry: 'https://registry.npmjs.org'
