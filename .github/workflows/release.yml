name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      # Same gate as CI, re-run on a clean checkout so a green local run cannot
      # be the only thing standing between a tag and npm.
      - run: yarn verify

      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag is $tagged but package.json says $declared." >&2
            exit 1
          fi

      - run: yarn npm publish --access public
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
